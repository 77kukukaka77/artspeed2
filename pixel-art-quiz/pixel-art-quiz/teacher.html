<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스피드 퀴즈 순위판</title>
<link rel="stylesheet" href="lib/style.css">
<style>
  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 24px; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .cam { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .view { position: relative; background: #1d1a1f; aspect-ratio: 4 / 3; border: 4px solid var(--ink); overflow: hidden; display: grid; place-items: center; color: #fff; font-size: 14px; text-align: center; }
  .view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .view .frame { position: absolute; inset: 14%; border: 4px dashed var(--yellow); pointer-events: none; }
  .msg { min-height: 52px; padding: 10px 12px; border: 3px solid var(--ink); background: var(--cream); font-size: 15px; line-height: 1.4; }
  .msg.ok { background: #c9f0c0; }
  .msg.bad { background: #ffc9c4; }
  .msg.dup { background: #fff0b0; }
  .opts { padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .opts .r { display: flex; gap: 8px; align-items: center; }
  .opts .r label { margin: 0; font-weight: 400; display: flex; gap: 6px; align-items: center; }
  .opts input[type=radio] { width: 20px; min-height: 20px; height: 20px; }
  .board { padding: 14px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar select { width: auto; }
  .count { margin-left: auto; font-size: 14px; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 9px 8px; border-bottom: 2px dashed rgba(42,31,36,.25); text-align: center; white-space: nowrap; }
  th { background: var(--ink); color: #fff; font-size: 13px; position: sticky; top: 0; }
  td.nm { text-align: left; }
  .medal { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 3px solid var(--ink); font-weight: 700; }
  .m1 { background: #f6c744; } .m2 { background: #d8dde4; } .m3 { background: #d99a5b; }
  tr.new td { animation: flash 1s steps(4); }
  @keyframes flash { 0%, 50% { background: #fff0b0; } }
  .del { font: inherit; background: none; border: 0; color: var(--red); cursor: pointer; min-height: 32px; text-decoration: underline; }
  .empty { padding: 30px; text-align: center; color: #6b5f63; }

  /* 순위 발표 (전체화면) */
  .stage { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding: 28px 16px; overflow: auto; }
  .stage.on { display: flex; }
  body.staging .wrap { visibility: hidden; }
  .stage h2 { font-size: clamp(32px, 5vw, 60px); margin: 0 0 20px; color: var(--yellow);
    text-shadow: 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 4px 0 var(--ink), 0 -4px 0 var(--ink), 4px 4px 0 var(--ink), -4px -4px 0 var(--ink), 4px -4px 0 var(--ink), -4px 4px 0 var(--ink); }
  .podium { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
  .pod { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pod .block { width: 150px; display: grid; place-items: center; font-size: 40px; font-weight: 700; border: 4px solid var(--ink); }
  .pod .who { background: #fff; border: 3px solid var(--ink); padding: 6px 10px; font-size: 18px; text-align: center; }
  .pod .who small { display: block; font-size: 14px; }
  .rest { width: min(720px, 100%); padding: 12px 16px; font-size: 18px; }
  .rest div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 2px dashed rgba(42,31,36,.25); }
  .stage .close { position: fixed; right: 16px; top: 16px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main class="wrap">
  <header class="panel drop">
    <h1>스피드 퀴즈 순위판</h1>
    <span class="tag">선생님용</span>
  </header>

  <div class="side">
    <section class="panel drop cam" aria-label="QR 스캔">
      <div class="view" id="view">카메라 시작을 눌러 주세요<video id="video" playsinline muted></video><div class="frame"></div></div>
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn green" id="camBtn" type="button">카메라 시작</button>
        <button class="btn white" id="flipBtn" type="button">카메라 전환</button>
        <label class="btn white" for="fileIn" style="margin:0;display:inline-flex;align-items:center">사진으로 스캔</label>
        <input class="sr-only" type="file" id="fileIn" accept="image/*" capture="environment">
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite">학생 결과 화면의 QR을 네모 칸 안에 비춰 주세요.</div>
    </section>

    <section class="panel opts" aria-label="설정">
      <b>같은 학생이 다시 도전했을 때</b>
      <div class="r"><label><input type="radio" name="dup" value="first" checked> 첫 기록 유지</label></div>
      <div class="r"><label><input type="radio" name="dup" value="best"> 최고 기록 유지</label></div>
      <div class="r"><label><input type="radio" name="dup" value="latest"> 최신 기록으로 교체</label></div>
      <small>동점이면 총 반응 시간이 짧은 학생이 앞 순위입니다.</small>
    </section>
  </div>

  <section class="panel drop board" aria-label="순위">
    <div class="toolbar">
      <label for="clsSel" class="sr-only">반 선택</label>
      <select id="clsSel"><option value="all">전체 반</option></select>
      <button class="btn" id="showBtn" type="button">순위 발표</button>
      <button class="btn blue" id="csvBtn" type="button">CSV 저장</button>
      <button class="btn red" id="clearBtn" type="button">기록 초기화</button>
      <span class="count" id="count">0명</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>순위</th><th>반</th><th>번호</th><th>이름</th><th>점수</th><th>정답</th><th>보너스</th><th>총 반응(초)</th><th>회차</th><th>스캔 시각</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty">아직 스캔한 기록이 없어요.</div>
    </div>
  </section>
</main>

<section class="stage" id="stage" aria-label="순위 발표">
  <button class="btn white close" id="closeStage" type="button">닫기</button>
  <h2 id="stageTitle">TOP RANKING</h2>
  <div class="podium" id="podium"></div>
  <div class="panel rest" id="rest"></div>
</section>

<script src="lib/pixel.js"></script>
<script src="lib/score.js"></script>
<script src="lib/jsQR.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const scene = new Pixel.Scene($('bg'), { seed: 5, crowd: 34 });

  const KEY = 'asq_teacher_records';
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* 무시 */ } }
  };
  let records = store.get();
  let lastId = null;

  const idOf = (r) => r.c + '-' + r.n;
  const better = (a, b) => (b.s - a.s) || (a.t - b.t); // 음수면 a가 앞
  function ranked(list) {
    const sorted = list.slice().sort(better);
    let rank = 0;
    return sorted.map((r, i) => {
      if (i === 0 || better(sorted[i - 1], r) !== 0) rank = i + 1;
      return Object.assign({ rank }, r);
    });
  }

  // ----- 메시지 / 효과음 -----
  function say(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  let actx = null;
  function beep(f) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(0.05, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.15); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.15); } catch (e) { /* 무시 */ } }

  // ----- 기록 추가 -----
  let lastText = '', lastTime = 0;
  function handleText(text) {
    const now = Date.now();
    if (text === lastText && now - lastTime < 4000) return; // 같은 QR 연속 인식 방지
    lastText = text; lastTime = now;
    const res = ScoreCode.decode(text);
    if (!res.ok) { say('인식 실패: ' + res.err, 'bad'); beep(180); return; }
    const r = res.rec;
    if (typeof r.s !== 'number' || r.s > r.q * 2 || r.k > r.q || r.b > r.k) { say('점수 값이 올바르지 않아요 (변조 의심)', 'bad'); beep(180); return; }
    const rec = { c: r.c, n: r.n, nm: r.nm, s: r.s, k: r.k, b: r.b, q: r.q, t: r.t, a: r.a, d: r.d, at: now };
    const who = r.c + '반 ' + r.n + '번 ' + r.nm;
    const i = records.findIndex((x) => idOf(x) === idOf(rec));
    const mode = document.querySelector('input[name=dup]:checked').value;
    if (i >= 0) {
      const old = records[i];
      if (old.d === rec.d) { say(who + ' : 이미 등록된 QR이에요.', 'dup'); beep(330); return; }
      let replace = mode === 'latest' || (mode === 'best' && better(rec, old) < 0);
      if (replace) { records[i] = rec; say(who + ' : 기록 교체 → ' + rec.s + '점 (' + rec.a + '회차)', 'dup'); }
      else { say(who + ' : 이미 등록됨. 기존 기록 ' + old.s + '점 유지 (이번 ' + rec.s + '점)', 'dup'); beep(330); return; }
    } else {
      records.push(rec);
      say(who + ' : ' + rec.s + '점 등록 완료!', 'ok');
    }
    lastId = idOf(rec);
    beep(880);
    store.set(records);
    render();
  }

  // ----- 표 그리기 -----
  function filtered() {
    const v = $('clsSel').value;
    return v === 'all' ? records : records.filter((r) => String(r.c) === v);
  }
  function render() {
    const classes = Array.from(new Set(records.map((r) => r.c))).sort((a, b) => a - b);
    const cur = $('clsSel').value;
    $('clsSel').innerHTML = '<option value="all">전체 반</option>' + classes.map((c) => `<option value="${c}">${c}반</option>`).join('');
    $('clsSel').value = classes.map(String).includes(cur) ? cur : 'all';

    const list = ranked(filtered());
    const tb = $('tbody'); tb.innerHTML = '';
    list.forEach((r) => {
      const tr = document.createElement('tr');
      if (idOf(r) === lastId) tr.className = 'new';
      const rankCell = r.rank <= 3 ? `<span class="medal m${r.rank}">${r.rank}</span>` : r.rank;
      const t = new Date(r.at);
      tr.innerHTML = `<td>${rankCell}</td><td>${r.c}</td><td>${r.n}</td><td class="nm"></td><td><b>${r.s}</b></td><td>${r.k}/${r.q}</td><td>${r.b}</td><td>${(r.t / 1000).toFixed(1)}</td><td>${r.a || 1}</td><td>${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}</td><td><button class="del" type="button">삭제</button></td>`;
      tr.querySelector('.nm').textContent = r.nm;
      tr.querySelector('.del').setAttribute('aria-label', r.nm + ' 기록 삭제');
      tr.querySelector('.del').addEventListener('click', (e) => {
        const b = e.currentTarget;
        if (b.dataset.armed) { records = records.filter((x) => idOf(x) !== idOf(r)); store.set(records); render(); }
        else { b.dataset.armed = '1'; b.textContent = '정말 삭제?'; setTimeout(() => { b.textContent = '삭제'; delete b.dataset.armed; }, 3000); }
      });
      tb.appendChild(tr);
    });
    $('empty').style.display = list.length ? 'none' : 'block';
    $('count').textContent = list.length + '명';
  }
  $('clsSel').addEventListener('change', render);

  // ----- 카메라 스캔 -----
  const video = $('video');
  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently: true });
  let stream = null, facing = 'environment', scanning = false;

  async function startCam() {
    stopCam();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream; await video.play();
      scanning = true; $('camBtn').textContent = '카메라 끄기';
      say('스캔 준비 완료! QR을 비춰 주세요.');
      requestAnimationFrame(scanLoop);
    } catch (e) {
      say('카메라를 켤 수 없어요. 주소가 https 인지, 카메라 권한을 허용했는지 확인해 주세요. "사진으로 스캔"도 쓸 수 있어요.', 'bad');
    }
  }
  function stopCam() {
    scanning = false;
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; $('camBtn').textContent = '카메라 시작';
  }
  let lastScan = 0;
  function scanLoop(ts) {
    if (!scanning) return;
    if (ts - lastScan > 180 && video.readyState >= 2) {
      lastScan = ts;
      const w = video.videoWidth, h = video.videoHeight;
      const scale = Math.min(1, 800 / Math.max(w, h));
      work.width = Math.round(w * scale); work.height = Math.round(h * scale);
      wctx.drawImage(video, 0, 0, work.width, work.height);
      const img = wctx.getImageData(0, 0, work.width, work.height);
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) handleText(code.data);
    }
    requestAnimationFrame(scanLoop);
  }
  $('camBtn').addEventListener('click', () => (scanning ? stopCam() : startCam()));
  $('flipBtn').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; if (scanning) startCam(); });

  $('fileIn').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
      work.width = Math.round(img.width * scale); work.height = Math.round(img.height * scale);
      wctx.drawImage(img, 0, 0, work.width, work.height);
      const d = wctx.getImageData(0, 0, work.width, work.height);
      const code = jsQR(d.data, d.width, d.height);
      lastText = '';
      if (code && code.data) handleText(code.data); else say('사진에서 QR을 찾지 못했어요. 더 가까이 찍어 주세요.', 'bad');
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
    e.target.value = '';
  });

  // ----- CSV / 초기화 -----
  $('csvBtn').addEventListener('click', () => {
    const list = ranked(filtered());
    const rows = [['순위', '반', '번호', '이름', '점수', '정답수', '문항수', '스피드보너스', '총반응(초)', '회차', '스캔시각']]
      .concat(list.map((r) => [r.rank, r.c, r.n, r.nm, r.s, r.k, r.q, r.b, (r.t / 1000).toFixed(1), r.a || 1, new Date(r.at).toLocaleString('ko-KR')]));
    const csv = '﻿' + rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const d = new Date();
    a.download = '스피드퀴즈_순위_' + ($('clsSel').value === 'all' ? '전체' : $('clsSel').value + '반') + '_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  });
  $('clearBtn').addEventListener('click', (e) => {
    const b = e.currentTarget;
    if (b.dataset.armed) { records = []; store.set(records); lastId = null; render(); say('기록을 모두 지웠어요.'); b.textContent = '기록 초기화'; delete b.dataset.armed; }
    else { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 삭제'; setTimeout(() => { b.textContent = '기록 초기화'; delete b.dataset.armed; }, 3000); }
  });

  // ----- 순위 발표 -----
  $('showBtn').addEventListener('click', () => {
    const list = ranked(filtered());
    $('stageTitle').textContent = ($('clsSel').value === 'all' ? '' : $('clsSel').value + '반 ') + 'TOP RANKING';
    const pod = $('podium'); pod.innerHTML = '';
    const order = [1, 0, 2]; // 2등-1등-3등 배치
    const heights = [170, 120, 90], colors = ['#f6c744', '#d8dde4', '#d99a5b'];
    order.forEach((i) => {
      const r = list[i]; if (!r) return;
      const el = document.createElement('div'); el.className = 'pod';
      const cv = document.createElement('canvas'); cv.className = 'pixelated';
      Pixel.drawBig(cv, Pixel.makeLook(Pixel.hashStr(r.nm + r.c + r.n)), 6);
      const who = document.createElement('div'); who.className = 'who';
      who.textContent = r.nm; const sm = document.createElement('small'); sm.textContent = r.c + '반 ' + r.n + '번 · ' + r.s + '점'; who.appendChild(sm);
      const blk = document.createElement('div'); blk.className = 'block';
      const place = Math.min(r.rank, 3) - 1;
      blk.style.height = heights[place] + 'px'; blk.style.background = colors[place]; blk.textContent = r.rank;
      el.append(cv, who, blk); pod.appendChild(el);
    });
    const rest = $('rest'); rest.innerHTML = '';
    list.slice(3, 10).forEach((r) => {
      const d = document.createElement('div');
      const a = document.createElement('span'); a.textContent = r.rank + '위  ' + r.c + '반 ' + r.n + '번 ' + r.nm;
      const b = document.createElement('b'); b.textContent = r.s + '점';
      d.append(a, b); rest.appendChild(d);
    });
    rest.style.display = list.length > 3 ? 'block' : 'none';
    scene.cheer = true;
    $('stage').classList.add('on'); document.body.classList.add('staging');
  });
  $('closeStage').addEventListener('click', () => { $('stage').classList.remove('on'); document.body.classList.remove('staging'); scene.cheer = false; });

  render();
  window.__teacher = { handleText, get records() { return records; } };
})();
</script>
</body>
</html>
